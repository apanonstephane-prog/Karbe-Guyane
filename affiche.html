<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Affiches QR · Karbé</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
body{background:#d9ded8} .ctl{max-width:820px;margin:0 auto;padding:20px 18px}.ctl h1{font:800 30px var(--f-display);margin:0 0 6px}
.ctl label{display:block;margin:10px 0 4px;font-weight:700}.ctl input,.ctl select{font:16px var(--f-text);padding:10px;border-radius:10px;border:1.5px solid var(--line);width:100%;box-sizing:border-box}
.sheet-a4{width:210mm;height:297mm;margin:10px auto 40px;background:var(--canopee);color:#fff;position:relative;overflow:hidden;box-shadow:0 10px 40px #0004;display:flex;flex-direction:column}
.sheet-a4 .img{height:118mm;background:center/cover;position:relative}.sheet-a4 .img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,var(--canopee))}
.sheet-a4 .in{flex:1;padding:0 18mm 16mm;display:flex;flex-direction:column}
.brand{font:800 15mm/1 var(--f-display);color:var(--awara);margin-top:-6mm;position:relative}
.ttl{font:800 12mm/1.02 var(--f-display);margin:5mm 0 4mm;max-width:150mm}
.sub{font-size:5mm;line-height:1.35;opacity:.9;max-width:150mm}
.bottom{margin-top:auto;display:flex;gap:10mm;align-items:center}
.qr{background:#fff;border-radius:6mm;padding:5mm;width:62mm;height:62mm;flex:none}.qr svg{width:100%;height:100%;display:block}
.pts{font-size:4.4mm;line-height:1.5}.pts b{color:var(--awara)}
.url{font-weight:700;margin-top:3mm;font-size:4.6mm}
@media print{@page{size:A4;margin:0}body{background:none}.ctl{display:none}.sheet-a4{margin:0;box-shadow:none}}
</style></head><body>
<div class="ctl"><a href="/stats.html" style="font-weight:800;color:var(--canopee)">← Fréquentation</a><h1>Affiches QR</h1>
<p>Une affiche par lieu de diffusion. Le code « provenance » permet de compter, dans les statistiques, combien de personnes ont découvert Karbé grâce à chaque affiche.</p>
<label>Provenance (lettres, chiffres, tirets)<input id="src" value="aeroport-felix-eboue"></label>
<label>Langue de l'affiche<select id="lg"><option value="fr">Français</option><option value="en">English</option><option value="pt">Português</option><option value="es">Español</option></select></label>
<p><button class="btn dark" onclick="print()">Imprimer ou enregistrer en PDF</button></p></div>
<div class="sheet-a4"><div class="img" style="background-image:url(/img/src/hero.webp)"></div><div class="in">
<div class="brand">Karbé</div><div class="ttl" id="t"></div><div class="sub" id="s"></div>
<div class="bottom"><div class="qr" id="qr"></div><div class="pts" id="p"></div></div></div></div>
<script src="/vendor/qrcode.js"></script>
<script>
const T={fr:["La Guyane dans votre poche.","Plages, forêt, bagne, fusées et marchés : 40+ lieux vérifiés, météo et marées, cartes hors-ligne. Gratuit, sans compte.",["<b>État des lieux</b> en direct","<b>Cartes</b> sans réseau","<b>Sécurité</b> : suivi de sortie"],"Scannez pour ouvrir"],
en:["French Guiana in your pocket.","Beaches, rainforest, penal colony, rockets and markets: 40+ checked places, weather and tides, offline maps. Free, no account.",["<b>Live</b> place conditions","<b>Maps</b> without signal","<b>Safety</b>: trip tracking"],"Scan to open"],
pt:["A Guiana Francesa no seu bolso.","Praias, floresta, presídio, foguetes e feiras: mais de 40 lugares verificados, tempo e marés, mapas off-line. Grátis, sem cadastro.",["<b>Condições</b> ao vivo","<b>Mapas</b> sem sinal","<b>Segurança</b>: acompanhamento do passeio"],"Escaneie para abrir"],
es:["La Guayana Francesa en tu bolsillo.","Playas, selva, presidio, cohetes y mercados: más de 40 lugares verificados, tiempo y mareas, mapas sin conexión. Gratis, sin cuenta.",["<b>Estado</b> de los lugares en directo","<b>Mapas</b> sin cobertura","<b>Seguridad</b>: seguimiento de salidas"],"Escanea para abrir"]};
function draw(){const src=document.getElementById("src").value.toLowerCase().replace(/[^a-z0-9-]/g,"").slice(0,40),lg=document.getElementById("lg").value,x=T[lg];
 const url=`https://karbe-guyane.vercel.app/?src=${src}&lang=${lg}`;const q=qrcode(0,"M");q.addData(url);q.make();
 document.getElementById("qr").innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true});
 document.getElementById("t").textContent=x[0];document.getElementById("s").textContent=x[1];
 document.getElementById("p").innerHTML=x[2].join("<br>")+`<div class="url">${x[3]} · karbe-guyane.vercel.app</div>`;}
document.getElementById("src").oninput=draw;document.getElementById("lg").onchange=draw;draw();
</script></body></html>
